name: upload-finance-project-folder

on:
  push:
    branches:
      - main
    paths:
      - "finguard-finance-project-1.0/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upload-finance-project-folder
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare finance project folder for gh-pages
        run: |
          mkdir -p deploy/finance-project
          cp -r finguard-finance-project-1.0 deploy/finance-project

      - name: Deploy finance project folder to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: deploy
          target_branch: gh-pages
          keep_files: true
          commit_message: "Add finguard-finance-project-1.0 source folder"
          force_orphan: false
