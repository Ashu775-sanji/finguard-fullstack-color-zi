name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      # The GitHub runner sets GITHUB_ACTIONS=true, which makes vite.config.ts
      # emit the /finguard-fullstack-color-zi/ base path automatically.
      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          commit_message: "deploy: ${{ github.event.head_commit.message }} (sha ${{ github.sha }})"
